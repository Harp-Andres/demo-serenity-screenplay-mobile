# Free personal device farm for demo-serenity-screenplay-mobile
# Stack: budtmo/docker-android (emulator + Appium) — 100% free / open source
#
# Requirements (Linux host):
#   - Docker + Compose
#   - /dev/kvm (hardware virtualization)
#   - ~4–6 GB RAM free per emulator node
#
# Quick start:
#   ./scripts/download-test-apps.sh
#   ./scripts/farm-up.sh
#   ./scripts/farm-run-e2e.sh
#   ./scripts/farm-down.sh
#
# VNC (see the emulator): http://localhost:6080
# Appium hub:            http://localhost:4723

name: serenity-free-farm

services:
  android-farm:
    image: budtmo/docker-android:emulator_11.0
    container_name: serenity-android-farm
    privileged: true
    devices:
      - /dev/kvm
    ports:
      - "4723:4723"   # Appium
      - "6080:6080"   # noVNC
      - "5555:5555"   # adb
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      APPIUM: "true"
      APPIUM_ADDITIONAL_ARGS: "--allow-insecure=adb_shell"
      DATAPARTITION: "2g"
    volumes:
      - ./apps:/farm/apps:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4723/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    restart: unless-stopped

  # Optional second virtual device (scale the free farm)
  android-farm-2:
    profiles: ["multi"]
    image: budtmo/docker-android:emulator_12.0
    container_name: serenity-android-farm-2
    privileged: true
    devices:
      - /dev/kvm
    ports:
      - "4724:4723"
      - "6081:6080"
      - "5556:5555"
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      APPIUM: "true"
      APPIUM_ADDITIONAL_ARGS: "--allow-insecure=adb_shell"
      DATAPARTITION: "2g"
    volumes:
      - ./apps:/farm/apps:ro
    restart: unless-stopped
