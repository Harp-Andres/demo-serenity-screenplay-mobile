# BrowserStack App Automate profile (Serenity + Appium).
# Prerequisites:
#   1. ./scripts/download-test-apps.sh
#   2. Upload APK:
#        curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
#          -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
#          -F "file=@apps/TheApp.apk" -F "custom_id=TheApp"
#   3. Export BROWSERSTACK_USERNAME, BROWSERSTACK_ACCESS_KEY, BROWSERSTACK_APP_URL (bs://...)
#
# Run:
#   ./gradlew e2e -Dproperties=src/test/resources/serenity-browserstack.conf

webdriver {
  driver = appium
}

appium {
  hub = "https://${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}@hub.browserstack.com/wd/hub"
  capabilities {
    platformName = "Android"
    automationName = "UiAutomator2"
    deviceName = "Samsung Galaxy S24"
    platformVersion = "14.0"
    app = "${BROWSERSTACK_APP_URL}"
    "bstack:options" {
      projectName = "demo-serenity-screenplay-mobile"
      buildName = "serenity-screenplay-android"
      sessionName = "theapp-login"
      debug = true
      networkLogs = true
      appiumLogs = true
      video = true
    }
  }
}

serenity {
  take.screenshots = AFTER_EACH_STEP
}
