# Cucumber / JUnit Platform — native demo reports (HTML + JSON + JUnit XML)
# SerenityReporterParallel feeds target/site/serenity for `aggregate`.
cucumber.plugin=net.serenitybdd.cucumber.core.plugin.SerenityReporterParallel,pretty,html:target/cucumber-reports/cucumber.html,json:target/cucumber-reports/cucumber.json,junit:target/cucumber-reports/cucumber.xml
cucumber.snippet-type=camelcase
cucumber.execution.parallel.enabled=false
