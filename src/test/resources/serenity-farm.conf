# Serenity profile for the free Docker/K8s personal farm
# (budtmo/docker-android: Appium + virtual device inside the container).
#
# Run:
#   ./scripts/farm-up.sh
#   ./gradlew e2e -Dproperties=src/test/resources/serenity-farm.conf
#
# Important: `app` path is INSIDE the container (volume ./apps → /farm/apps).

webdriver {
  driver = appium
}

appium {
  hub = "http://127.0.0.1:4723"
  capabilities {
    platformName = "Android"
    automationName = "UiAutomator2"
    deviceName = "emulator-5554"
    app = "/farm/apps/TheApp.apk"
    appPackage = "com.appiumpro.the_app"
    appActivity = ".MainActivity"
    autoGrantPermissions = true
    noReset = false
    newCommandTimeout = 180
  }
}

serenity {
  take.screenshots = AFTER_EACH_STEP
}
