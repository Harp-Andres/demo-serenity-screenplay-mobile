# Host / CI AVD (android-emulator-runner or local Appium on :4723).
# Serenity reads flat appium.* keys. Enable process.desired.capabilities so
# vendor caps are sent as appium:* (required by Appium Java Client 8+/W3C).

webdriver {
  driver = appium
}

appium {
  hub = "http://127.0.0.1:4723/"
  platformName = "Android"
  automationName = "UiAutomator2"
  deviceName = "Android Emulator"
  udid = "emulator-5554"
  app = "${user.dir}/apps/TheApp.apk"
  appPackage = "com.appiumpro.the_app"
  appActivity = ".MainActivity"
  autoGrantPermissions = true
  noReset = false
  newCommandTimeout = 180
  # Prefix non-W3C keys with appium: before newSession
  process.desired.capabilities = true
  additional.capabilities = "app,appActivity,appPackage,autoGrantPermissions,automationName,deviceName,newCommandTimeout,noReset,udid"
}

serenity {
  take.screenshots = AFTER_EACH_STEP
}
