# Default LOCAL profile — keeps emulator/Appium-on-laptop working.
# Cloud: use serenity-browserstack.conf via
#   ./gradlew e2e -Dproperties=src/test/resources/serenity-browserstack.conf
# or copy/merge in CI.

webdriver {
  driver = appium
}

appium {
  hub = "http://127.0.0.1:4723"
  capabilities {
    platformName = "Android"
    automationName = "UiAutomator2"
    deviceName = "emulator-5554"
    // Download with: ./scripts/download-test-apps.sh
    app = "${user.dir}/apps/TheApp.apk"
    appPackage = "com.appiumpro.the_app"
    appActivity = ".MainActivity"
    autoGrantPermissions = true
    newCommandTimeout = 120
  }
}

serenity {
  take.screenshots = AFTER_EACH_STEP
}
