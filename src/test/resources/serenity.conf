webdriver {
  driver = appium
  # Sin /wd/hub para Appium 2/3
  remote.url = "http://127.0.0.1:4723"
}

# Configuración específica para el motor de Appium 3 + Cliente 10
appium {
    hub = "http://127.0.0.1:4723"
}

# Aquí es donde ocurre la magia en las versiones recientes
webdriver {
  capabilities {
    platformName = Android
    "appium:automationName" = "UIAutomator2"
    "appium:deviceName" = "emulator-5554"
    "appium:udid" = "emulator-5554"
    "appium:appPackage" = "com.google.android.apps.safetyhub"
    "appium:appActivity" = ".LauncherActivity"
    #1. Asegura que la app se cierre y limpie datos al terminar
    "appium:noReset" = false
    #Cambia a true solo si necesitas reinstalar la app cada vez
    "appium:fullReset" = false

     # 2. Forzar el cierre de la app si ya estaba abierta por un error previo
     "appium:forceAppLaunch" = true
     "appium:shouldTerminateApp" = true

    # Agrega esta "capability" de Appium para forzar la compatibilidad de visibilidad
    "appium:enforceAppiumInstalls" = true
    "appium:disableIdLocatorAutocompletion" = true

    "appium:newCommandTimeout" = 120
    # Obligatorio para W3C

     # Esto evita que Appium intente usar comandos de navegador
     "appium:nativeWebScreenshot" = true
     "appium:settings[allowInvisibleElements]" = true
     "appium:settings[enableMultiWindows]" = true
  }
}


serenity {
  project.name = "Mi Proyecto Mobile"
  report.encoding = "UTF-8"
  driver.capabilities = "appium"
  take.screenshots = BEFORE_AND_AFTER_EACH_STEP
  report.source = false
}
