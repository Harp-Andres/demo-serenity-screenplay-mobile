# Host / CI AVD profile (android-emulator-runner or local Appium on :4723).
# Appium 2/3 + Java client require appium:-prefixed W3C capabilities.

webdriver {
  driver = appium
  capabilities {
    platformName = "Android"
    "appium:automationName" = "UiAutomator2"
    "appium:deviceName" = "Android Emulator"
    "appium:udid" = "emulator-5554"
    "appium:app" = "${user.dir}/apps/TheApp.apk"
    "appium:appPackage" = "com.appiumpro.the_app"
    "appium:appActivity" = ".MainActivity"
    "appium:autoGrantPermissions" = true
    "appium:noReset" = false
    "appium:newCommandTimeout" = 180
    "appium:adbExecTimeout" = 120000
  }
}

appium {
  hub = "http://127.0.0.1:4723/"
}

serenity {
  take.screenshots = AFTER_EACH_STEP
}
