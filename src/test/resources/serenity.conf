webdriver {
  driver = appium
}

appium {
  # URL del servidor Appium (Appium 2.x/3.x suele omitir /wd/hub por defecto)
  hub = "http://127.0.0.1:4723"

  # Capacidades comunes W3C
  platformName = "Android"
  automationName = "UIAutomator2"
  deviceName = "emulator-5554"
  appPackage = "com.google.android.apps.safetyhub"
  appActivity = ".LauncherActivity"

  # Opciones adicionales
  noReset = true
  fullReset = false
  nativeWebScreenshot = true
  newCommandTimeout = 1000
}

serenity {
  project.name = "Mi Proyecto Appium con Serenity 5"
  take.screenshots = FOR_FAILURES
  logging = VERBOSE
}
