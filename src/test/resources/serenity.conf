webdriver {
  driver = appium
  # Sin /wd/hub para Appium 2/3
  remote.url = "http://127.0.0.1:4723"
}

# Configuración específica para el motor de Appium 3 + Cliente 10
appium {
    hub = "http://127.0.0.1:4723"
}

# Aquí es donde ocurre la magia en las versiones recientes
webdriver {
  capabilities {
    platformName = "Android"
    "appium:automationName" = "UIAutomator2"
    "appium:deviceName" = "emulator-5554"
    "appium:udid" = "emulator-5554"
    "appium:appPackage" = "com.google.android.apps.safetyhub"
    "appium:appActivity" = ".LauncherActivity"
    "appium:noReset" = true
    "appium:fullReset" = false
    "appium:newCommandTimeout" = 120
    # Obligatorio para W3C
    "appium:options" {
        systemPort = 8200
    }
  }
}


serenity {
  project.name = "Mi Proyecto Mobile"
  report.encoding = "UTF-8"
  serenity.take.screenshots = FOR_FAILING_STEPS
  serenity.report.source = false
}
