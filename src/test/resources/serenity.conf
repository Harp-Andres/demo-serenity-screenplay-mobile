webdriver {
  driver = appium
}

appium {
  hub = "http://127.0.0.1:4723" // URL del servidor Appium [2]
  capabilities {
    platformName = "Android"
    automationName = "UiAutomator2" // O XCUITest para iOS [4]
    deviceName = "emulator-5554" // O nombre de tu dispositivo real
    udid = "emulator-5554"
    appPackage = "com.google.android.apps.safetyhub"
    appActivity = ".LauncherActivity"
  }
}
