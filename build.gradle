plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.1.0'
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '5.1.0'
    junit5Version = '6.1.0-M1'
    log4jVersion = '2.25.3'
    guavaVersion = '33.5.0-jre'
    serenityJunit5Version = '5.2.1'
    appiumVersion = '10.0.0'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"
    testImplementation("net.serenity-bdd:serenity-junit5:${serenityJunit5Version}")
    implementation "io.appium:java-client:${appiumVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation("org.junit.jupiter:junit-jupiter-engine:${junit5Version}")
    testImplementation("io.cucumber:cucumber-junit-platform-engine:7.34.2")
    testImplementation("org.junit.platform:junit-platform-suite-engine:${junit5Version}")
    implementation "com.google.guava:guava:${guavaVersion}"
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}"
    implementation "org.slf4j:slf4j-api:2.0.17"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    test {
        resources {
            srcDir 'src/test/resources/'
        }
    }
}

processTestResources {
    duplicatesStrategy = DuplicatesStrategy.WARN
}

defaultTasks('clean', 'test', 'aggregate')

test {
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.harp.demo.screenplay.unit.*'
    }
    systemProperty "file.encoding", "UTF-8"
    systemProperties System.getProperties() as Map<String, ? extends Object>

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

tasks.register('e2e', Test) {
    group = 'verification'
    description = 'Runs Cucumber mobile E2E scenarios (requires Appium + device/emulator).'
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.harp.demo.screenplay.runners.*'
    }
    systemProperty "file.encoding", "UTF-8"
    systemProperties System.getProperties() as Map<String, ? extends Object>
    finalizedBy aggregate
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

serenity {
    reports = ['single-page-html']
}
