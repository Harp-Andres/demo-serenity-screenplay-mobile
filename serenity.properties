serenity.project.name = harp-demo-screenplay-mobile
serenity.test.root = com.harp.demo.screenplay

# Full native Serenity HTML (device / environment / screenshots when e2e runs)
serenity.outputDirectory = target/site/serenity
serenity.take.screenshots = AFTER_EACH_STEP
serenity.report.show.manual.tests = false
serenity.report.show.releases = false

# Surface Appium / device capabilities in the Environment section of the report
serenity.report.tag.capabilities = true
serenity.inject.driver.capabilities = true
