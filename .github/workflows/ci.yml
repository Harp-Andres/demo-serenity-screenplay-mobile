name: Build & Test

on:
  push:
    branches: [main, develop, 'refactor/**', 'fix/**']
  pull_request:
    branches: [main, develop, 'refactor/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve dependencies
        run: ./gradlew --no-daemon help dependencies

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile main and test sources
        run: ./gradlew --no-daemon compileJava compileTestJava

  test-unit:
    timeout-minutes: 15
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and Serenity aggregate
        run: ./gradlew --no-daemon clean test aggregate

      - name: Upload Serenity HTML report (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report-unit
          path: |
            target/site/serenity/
            target/site/serenity/summary.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Gradle HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Unit tests + Serenity report"
            echo ""
            echo "Unit tests use SerenityJUnit5 (no Appium). **Devices appear only in the e2e / farm report.**"
            echo ""
            if [ -f target/site/serenity/summary.txt ]; then
              echo '```'
              cat target/site/serenity/summary.txt
              echo '```'
            fi
            echo "- Artifact **serenity-report-unit** → open \`index.html\` via a local HTTP server (see \`scripts/serve-reports.sh\`)."
            echo "- Artifact **gradle-test-report** / **junit-xml**"
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional mobile e2e: needs KVM + Docker (self-hosted / farm-capable runners).
  # On github-hosted ubuntu-latest this job skips (no /dev/kvm) so required checks stay green.
  test-e2e:
    timeout-minutes: 45
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect free-farm capability (KVM + Docker)
        id: farm
        run: |
          if [[ -e /dev/kvm ]] && command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Free farm capable runner detected"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping e2e: no KVM/Docker farm on this runner (expected on GitHub-hosted)."
          fi

      - name: Set up JDK 21
        if: steps.farm.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for scripts
        if: steps.farm.outputs.available == 'true'
        run: chmod +x gradlew scripts/*.sh

      - name: Start free farm and run Cucumber e2e
        if: steps.farm.outputs.available == 'true'
        run: |
          ./scripts/farm-up.sh
          ./gradlew --no-daemon e2e aggregate -Dproperties=src/test/resources/serenity-farm.conf
        env:
          # Still emit Cucumber/Serenity HTML when a scenario fails.
          ORG_GRADLE_PROJECT_e2eIgnoreFailures: 'false'

      - name: Upload Serenity HTML report (e2e / devices)
        if: always() && steps.farm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report-e2e
          path: target/site/serenity/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Cucumber native reports (HTML + JSON + JUnit XML)
        if: always() && steps.farm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: target/cucumber-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload e2e Gradle / JUnit XML
        if: always() && steps.farm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-xml
          path: build/test-results/e2e/
          retention-days: 14
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Mobile e2e (Cucumber + Serenity Screenplay)"
            echo ""
            if [ "${{ steps.farm.outputs.available }}" != "true" ]; then
              echo "Skipped on this runner (no KVM/Docker). For device counts in Serenity Environment:"
              echo "\`\`\`bash"
              echo "./scripts/farm-run-e2e.sh"
              echo "./scripts/serve-reports.sh"
              echo "\`\`\`"
            else
              if [ -f target/site/serenity/summary.txt ]; then
                echo '```'
                cat target/site/serenity/summary.txt
                echo '```'
              fi
              echo "- **serenity-report-e2e** → devices / capabilities / screenshots"
              echo "- **cucumber-reports** → \`cucumber.html\` + \`cucumber.json\` + \`cucumber.xml\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew --no-daemon classes testClasses

      - name: Upload build classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            build/classes/
            build/resources/
          retention-days: 7
          if-no-files-found: warn

  notify:
    if: always()
    needs: [lint, test-unit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.test-unit.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Lint, unit tests and build PASSED — demo reports available as artifacts."
          else
            echo "❌ Lint, tests or build FAILED — review logs and artifacts."
            exit 1
          fi
