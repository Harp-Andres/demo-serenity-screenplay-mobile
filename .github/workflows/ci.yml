name: Build & Test

on:
  push:
    branches: [main, develop, 'refactor/**', 'fix/**']
  pull_request:
    branches: [main, develop, 'refactor/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve dependencies
        run: ./gradlew --no-daemon help dependencies

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile main and test sources
        run: ./gradlew --no-daemon compileJava compileTestJava

  test-unit:
    timeout-minutes: 15
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and Serenity aggregate
        run: ./gradlew --no-daemon clean test aggregate

      - name: Upload Serenity HTML report (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report-unit
          path: |
            target/site/serenity/
            target/site/serenity/summary.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Gradle HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn

      # Azure-style: test results visible inside the same workflow run (Checks / Annotations).
      - name: Publish JUnit results in workflow (Checks)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit tests (JUnit)
          path: build/test-results/test/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          list-suites: all
          list-tests: all

      - name: Job summary (in-run report, Azure-style Summary)
        if: always()
        run: |
          {
            echo "## Unit tests + Serenity report (same Action)"
            echo ""
            echo "| View | Where |"
            echo "| --- | --- |"
            echo "| **This run — Summary** | table below (this page) |"
            echo "| **This run — Checks** | check **Unit tests (JUnit)** on the PR / commit |"
            echo "| **This run — Artifacts** | download **serenity-report-unit** (full HTML) |"
            echo "| **Live web (main)** | https://harp-andres.github.io/demo-serenity-screenplay-mobile/ |"
            echo ""
            echo "Unit tests use SerenityJUnit5 (no Appium). **Devices** only after farm e2e."
            echo ""
            if [ -f target/site/serenity/summary.txt ]; then
              # Parse Serenity summary into a markdown table for the workflow UI.
              scen=$(sed -n 's/^Number of scenarios:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              cases=$(sed -n 's/^Number of test cases:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              passed=$(sed -n 's/^Passed:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              failed=$(sed -n 's/^Failed:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              errors=$(sed -n 's/^Failed with errors:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              echo "### Serenity aggregate"
              echo ""
              echo "| Metric | Count |"
              echo "| --- | ---: |"
              echo "| Scenarios | ${scen:-?} |"
              echo "| Test cases | ${cases:-?} |"
              echo "| Passed | ${passed:-?} |"
              echo "| Failed | ${failed:-?} |"
              echo "| Failed with errors | ${errors:-?} |"
              echo ""
              echo "<details><summary>Raw summary.txt</summary>"
              echo ""
              echo '```'
              cat target/site/serenity/summary.txt
              echo '```'
              echo ""
              echo "</details>"
            else
              echo "_Serenity summary.txt not found._"
            fi
            echo ""
            echo "Full interactive Serenity HTML is in artifact **serenity-report-unit** (or Pages after merge to \`main\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Cloud ephemeral Android device (KVM AVD) + Appium + Serenity Cucumber e2e.
  # Local alternative: Docker/K8s farm via ./scripts/farm-run-e2e.sh (budtmo/docker-android).
  test-e2e:
    timeout-minutes: 35
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for ephemeral emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node (Appium)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + UiAutomator2
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version
          appium driver list --installed

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/*.sh

      - name: Run Cucumber e2e on ephemeral Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # android-emulator-runner invokes /bin/sh (no bash pipefail).
          script: |
            appium --address 127.0.0.1 --port 4723 --base-path / --log appium-ci.log &
            echo $! > appium.pid
            bash ./scripts/ci-e2e-on-emulator.sh
            status=$?
            kill "$(cat appium.pid)" 2>/dev/null || true
            sleep 2
            kill -9 "$(cat appium.pid)" 2>/dev/null || true
            exit $status

      - name: Upload Serenity HTML report (e2e / devices)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report-e2e
          path: target/site/serenity/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Cucumber native reports (HTML + JSON + JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: target/cucumber-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload e2e Gradle / JUnit XML + Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-xml
          path: |
            build/test-results/e2e/
            target/cucumber-reports/cucumber.xml
            appium-ci.log
          retention-days: 14
          if-no-files-found: warn

      - name: Publish e2e / Cucumber results in workflow (Checks)
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: E2E Cucumber (JUnit)
          path: |
            build/test-results/e2e/TEST-*.xml
            target/cucumber-reports/cucumber.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
          list-suites: all
          list-tests: all

      - name: Job summary (in-run report)
        if: always()
        run: |
          {
            echo "## Mobile e2e — ephemeral cloud device"
            echo ""
            echo "Device: Android Emulator API 29 (KVM) + Appium UiAutomator2 + TheApp"
            echo ""
            echo "| View | Where |"
            echo "| --- | --- |"
            echo "| **This run — Checks** | **E2E Cucumber (JUnit)** |"
            echo "| **This run — Artifacts** | **serenity-report-e2e**, **cucumber-reports** |"
            echo "| **Live web (main)** | Pages prefers e2e report when present |"
            echo ""
            if [ -f target/site/serenity/summary.txt ]; then
              echo '```'
              cat target/site/serenity/summary.txt
              echo '```'
            else
              echo "_No Serenity summary (e2e may have failed before aggregate)._"
            fi
            echo ""
            echo "Local Docker/K8s farm: \`./scripts/farm-run-e2e.sh\` · Job: \`k8s/android-farm-ephemeral-job.yaml\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew --no-daemon classes testClasses

      - name: Upload build classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            build/classes/
            build/resources/
          retention-days: 7
          if-no-files-found: warn

  notify:
    if: always()
    needs: [lint, test-unit, test-e2e, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.test-unit.result }}" == "success" ] && \
             [ "${{ needs.test-e2e.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Lint, unit, e2e (ephemeral device) and build PASSED — demo reports ready."
          else
            echo "❌ Lint, unit, e2e or build FAILED — review logs and artifacts."
            exit 1
          fi

  # Publish Serenity HTML to GitHub Pages after green CI on main (prefer e2e / devices).
  publish-report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [notify, test-unit, test-e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Serenity e2e report (devices)
        id: e2e_report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: serenity-report-e2e
          path: _site

      - name: Fallback to unit report
        if: steps.e2e_report.outcome != 'success'
        uses: actions/download-artifact@v4
        with:
          name: serenity-report-unit
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary
        run: |
          {
            echo "## Live Serenity report (GitHub Pages)"
            echo ""
            echo "Open: **https://harp-andres.github.io/demo-serenity-screenplay-mobile/**"
            echo ""
            if [ -f _site/summary.txt ]; then
              echo '```'
              cat _site/summary.txt
              echo '```'
            fi
            echo "Page URL from deploy: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
