name: Build & Test

on:
  push:
    branches: [main, develop, 'refactor/**', 'fix/**']
  pull_request:
    branches: [main, develop, 'refactor/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve dependencies
        run: ./gradlew --no-daemon help dependencies

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile main and test sources
        run: ./gradlew --no-daemon compileJava compileTestJava

  test-unit:
    timeout-minutes: 15
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and Serenity aggregate
        run: ./gradlew --no-daemon clean test aggregate

      - name: Upload Serenity HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: target/site/serenity/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Gradle HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Unit tests + Serenity report"
            echo ""
            if [ -f target/site/serenity/index.html ]; then
              echo "- Serenity index: \`target/site/serenity/index.html\` (artifact **serenity-report**)"
            else
              echo "- Serenity index: missing"
            fi
            if [ -d build/reports/tests ]; then
              echo "- Gradle HTML: artifact **gradle-test-report**"
            fi
            if [ -d build/test-results/test ]; then
              echo "- JUnit XML: artifact **junit-xml**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew --no-daemon classes testClasses

      - name: Upload build classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            build/classes/
            build/resources/
          retention-days: 7
          if-no-files-found: warn

  notify:
    if: always()
    needs: [lint, test-unit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.test-unit.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Lint, unit tests and build PASSED — demo reports available as artifacts."
          else
            echo "❌ Lint, tests or build FAILED — review logs and artifacts."
            exit 1
          fi
