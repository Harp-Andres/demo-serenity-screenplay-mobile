name: Build & Test

on:
  push:
    branches: [main, develop, 'refactor/**', 'fix/**']
  pull_request:
    branches: [main, develop, 'refactor/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve dependencies
        run: ./gradlew --no-daemon help dependencies

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile main and test sources
        run: ./gradlew --no-daemon compileJava compileTestJava

  test-unit:
    timeout-minutes: 15
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and Serenity aggregate
        run: ./gradlew --no-daemon clean test aggregate

      - name: Upload Serenity HTML report (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report-unit
          path: |
            target/site/serenity/
            target/site/serenity/summary.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Gradle HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn

      # Azure-style: test results visible inside the same workflow run (Checks / Annotations).
      - name: Publish JUnit results in workflow (Checks)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit tests (JUnit)
          path: build/test-results/test/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          list-suites: all
          list-tests: all

      - name: Job summary (in-run report, Azure-style Summary)
        if: always()
        run: |
          {
            echo "## Unit tests + Serenity report (same Action)"
            echo ""
            echo "| View | Where |"
            echo "| --- | --- |"
            echo "| **This run — Summary** | table below (this page) |"
            echo "| **This run — Checks** | check **Unit tests (JUnit)** on the PR / commit |"
            echo "| **This run — Artifacts** | download **serenity-report-unit** (full HTML) |"
            echo "| **Live web (main)** | https://harp-andres.github.io/demo-serenity-screenplay-mobile/ |"
            echo ""
            echo "Unit tests use SerenityJUnit5 (no Appium). **Devices** only after farm e2e."
            echo ""
            if [ -f target/site/serenity/summary.txt ]; then
              # Parse Serenity summary into a markdown table for the workflow UI.
              scen=$(sed -n 's/^Number of scenarios:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              cases=$(sed -n 's/^Number of test cases:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              passed=$(sed -n 's/^Passed:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              failed=$(sed -n 's/^Failed:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              errors=$(sed -n 's/^Failed with errors:[[:space:]]*//p' target/site/serenity/summary.txt | head -1)
              echo "### Serenity aggregate"
              echo ""
              echo "| Metric | Count |"
              echo "| --- | ---: |"
              echo "| Scenarios | ${scen:-?} |"
              echo "| Test cases | ${cases:-?} |"
              echo "| Passed | ${passed:-?} |"
              echo "| Failed | ${failed:-?} |"
              echo "| Failed with errors | ${errors:-?} |"
              echo ""
              echo "<details><summary>Raw summary.txt</summary>"
              echo ""
              echo '```'
              cat target/site/serenity/summary.txt
              echo '```'
              echo ""
              echo "</details>"
            else
              echo "_Serenity summary.txt not found._"
            fi
            echo ""
            echo "Full interactive Serenity HTML is in artifact **serenity-report-unit** (or Pages after merge to \`main\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional mobile e2e (devices + Cucumber reports).
  # GitHub-hosted runners often expose /dev/kvm but cannot boot nested Android emulators,
  # so farm e2e is opt-in: self-hosted runner OR repo variable ENABLE_SERENITY_FARM_E2E=true.
  test-e2e:
    timeout-minutes: 45
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect free-farm capability
        id: farm
        env:
          ENABLE_FARM: ${{ vars.ENABLE_SERENITY_FARM_E2E }}
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          set -euo pipefail
          WANT=false
          if [[ "$RUNNER_ENV" == "self-hosted" ]]; then
            WANT=true
          fi
          if [[ "${ENABLE_FARM:-}" == "true" ]]; then
            WANT=true
          fi
          if [[ "$WANT" != "true" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping e2e on github-hosted (nested emulator unreliable)."
            echo "Enable with self-hosted runner or repo variable ENABLE_SERENITY_FARM_E2E=true."
            echo "Local demo: ./scripts/farm-run-e2e.sh && ./scripts/serve-reports.sh"
            exit 0
          fi
          if [[ -e /dev/kvm ]] && command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Free farm enabled on this runner"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Farm requested but /dev/kvm or Docker missing — skipping."
          fi

      - name: Set up JDK 21
        if: steps.farm.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for scripts
        if: steps.farm.outputs.available == 'true'
        run: chmod +x gradlew scripts/*.sh

      - name: Start free farm and run Cucumber e2e
        if: steps.farm.outputs.available == 'true'
        run: |
          ./scripts/farm-up.sh
          ./gradlew --no-daemon e2e aggregate -Dproperties=src/test/resources/serenity-farm.conf

      - name: Upload Serenity HTML report (e2e / devices)
        if: always() && steps.farm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report-e2e
          path: target/site/serenity/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Cucumber native reports (HTML + JSON + JUnit XML)
        if: always() && steps.farm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: target/cucumber-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload e2e Gradle / JUnit XML
        if: always() && steps.farm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-xml
          path: |
            build/test-results/e2e/
            target/cucumber-reports/cucumber.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Publish e2e / Cucumber results in workflow (Checks)
        if: always() && steps.farm.outputs.available == 'true'
        uses: dorny/test-reporter@v1
        with:
          name: E2E Cucumber (JUnit)
          path: |
            build/test-results/e2e/TEST-*.xml
            target/cucumber-reports/cucumber.xml
          reporter: java-junit
          fail-on-error: false
          list-suites: all
          list-tests: all

      - name: Job summary (in-run report)
        if: always()
        run: |
          {
            echo "## Mobile e2e (Cucumber + Serenity Screenplay)"
            echo ""
            if [ "${{ steps.farm.outputs.available }}" != "true" ]; then
              echo "Skipped (opt-in farm). For **device counts** in Serenity Environment:"
              echo "\`\`\`bash"
              echo "./scripts/farm-run-e2e.sh"
              echo "./scripts/serve-reports.sh"
              echo "\`\`\`"
              echo "Or set repo variable \`ENABLE_SERENITY_FARM_E2E=true\` on a farm-capable runner."
            else
              echo "| View | Where |"
              echo "| --- | --- |"
              echo "| **This run — Checks** | **E2E Cucumber (JUnit)** |"
              echo "| **This run — Artifacts** | **serenity-report-e2e**, **cucumber-reports** |"
              echo ""
              if [ -f target/site/serenity/summary.txt ]; then
                echo '```'
                cat target/site/serenity/summary.txt
                echo '```'
              fi
              echo "- **serenity-report-e2e** → devices / capabilities / screenshots"
              echo "- **cucumber-reports** → \`cucumber.html\` + \`cucumber.json\` + \`cucumber.xml\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew --no-daemon classes testClasses

      - name: Upload build classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            build/classes/
            build/resources/
          retention-days: 7
          if-no-files-found: warn

  notify:
    if: always()
    needs: [lint, test-unit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.test-unit.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Lint, unit tests and build PASSED — demo reports available as artifacts."
          else
            echo "❌ Lint, tests or build FAILED — review logs and artifacts."
            exit 1
          fi

  # Publish Serenity HTML to GitHub Pages after green CI on main (viewable in the browser).
  publish-report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [notify, test-unit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Serenity unit report artifact
        uses: actions/download-artifact@v4
        with:
          name: serenity-report-unit
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary
        run: |
          {
            echo "## Live Serenity report (GitHub Pages)"
            echo ""
            echo "Open: **https://harp-andres.github.io/demo-serenity-screenplay-mobile/**"
            echo ""
            echo "Page URL from deploy: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
